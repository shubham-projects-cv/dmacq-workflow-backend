services:

  postgres:
    image: postgres:16
    container_name: workflow-postgres
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  temporal:
    image: temporalio/auto-setup:1.25
    container_name: temporal-server
    depends_on:
      - postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    restart: always


  temporal-ui:
    image: temporalio/ui:latest
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8088:8080"


  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: workflow-api
    depends_on:
      - temporal
    ports:
      - "4000:4000"
    environment:
      TEMPORAL_ADDRESS: temporal:7233


  email:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    container_name: workflow-email
    ports:
      - "5000:5000"
    env_file:
      - services/email/.env


  workflow:
    build:
      context: .
      dockerfile: services/workflow/Dockerfile
    container_name: workflow-worker
    depends_on:
      - temporal
      - api
      - email
    environment:
      - TEMPORAL_ADDRESS=temporal:7233


volumes:
  pgdata:
